<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="sml-arch" width="100%" viewBox="30 0 1550 1064" role="img" aria-label="SustainML Framework architecture">
<style>svg.sml-arch{font-family:"DejaVu Sans",Arial,Helvetica,sans-serif}.sml-arch .sml-arch-t{font-size:17px;fill:#1d2b1f}.sml-arch .sml-arch-b{font-weight:bold}.sml-arch .sml-arch-s{font-size:14px;fill:#3c4a3e}.sml-arch .sml-arch-lab{font-size:14px;fill:#2f5d34;font-style:italic}</style>
<rect x="30" y="0" width="1550" height="1064" fill="#fff"/>
<defs>
<marker id="sml_arch_arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="sml_arch_arrow2" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333"/></marker>
</defs>
<!-- user -->
<circle cx="560" cy="28" r="14" fill="none" stroke="#333" stroke-width="2"/><path d="M536,70 q24,-30 48,0" fill="none" stroke="#333" stroke-width="2"/>
<text x="600" y="55" class="sml-arch-t">User</text>
<line x1="560" y1="76" x2="560" y2="104" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<!-- front-end -->
<g id="front-end" class="module_node" style="cursor:pointer">
<rect x="160" y="108" width="800" height="92" rx="12" fill="#fde8e6" stroke="#c0504d" stroke-width="2"/>
<text x="560" y="140" text-anchor="middle" class="sml-arch-t sml-arch-b">Front-End: sustainml desktop application</text>
<text x="560" y="165" text-anchor="middle" class="sml-arch-s">C++ and QML (Qt 5.15): problem definition, results, YOLO / U-Net / Hugging Face model screens,</text>
<text x="560" y="185" text-anchor="middle" class="sml-arch-s">node status, save and load</text>
</g>
<line x1="560" y1="200" x2="560" y2="262" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)" marker-start="url(#sml_arch_arrow2)"/>
<text x="575" y="236" class="sml-arch-lab">REST API, JSON over HTTP (127.0.0.1:5001)</text>
<!-- back-end -->
<g id="orchestrator" class="module_node" style="cursor:pointer">
<rect x="150" y="266" width="820" height="210" rx="12" fill="#e3edf9" stroke="#4f81bd" stroke-width="2"/>
<text x="560" y="294" text-anchor="middle" class="sml-arch-t sml-arch-b">Back-End process (sustainml-wp5/backend_node.py)</text>
<rect x="180" y="310" width="240" height="70" rx="8" fill="#fff" stroke="#4f81bd"/>
<text x="300" y="340" text-anchor="middle" class="sml-arch-t">Flask REST server</text><text x="300" y="362" text-anchor="middle" class="sml-arch-s">tasks, results, status, requests</text>
<rect x="440" y="310" width="260" height="70" rx="8" fill="#fff" stroke="#4f81bd"/>
<text x="570" y="336" text-anchor="middle" class="sml-arch-t">Python Orchestrator</text><text x="570" y="356" text-anchor="middle" class="sml-arch-s">JSON results, reiterations,</text><text x="570" y="373" text-anchor="middle" class="sml-arch-s">save and load</text>
<rect x="720" y="310" width="225" height="70" rx="8" fill="#fff" stroke="#4f81bd"/>
<text x="832" y="340" text-anchor="middle" class="sml-arch-t">OrchestratorNode</text><text x="832" y="362" text-anchor="middle" class="sml-arch-s">C++ (sustainml_cpp), DDS</text>
<line x1="420" y1="345" x2="438" y2="345" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<line x1="700" y1="345" x2="718" y2="345" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<text x="420" y="410" text-anchor="middle" class="sml-arch-s">Also in the process: Hugging Face model information</text><text x="420" y="428" text-anchor="middle" class="sml-arch-s">and LLM comparison of models</text>
<rect x="260" y="436" width="320" height="32" rx="6" fill="#f4f4f4" stroke="#888" stroke-dasharray="5,3"/>
<text x="420" y="457" text-anchor="middle" class="sml-arch-s">Save files (SQLite, one per save name)</text>
</g>
<!-- DDS -->
<line x1="832" y1="380" x2="832" y2="530" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)" marker-start="url(#sml_arch_arrow2)"/>
<text x="845" y="505" class="sml-arch-lab">DDS topics + configuration RPC</text>
<rect x="40" y="534" width="1100" height="520" rx="14" fill="#f3f8f0" stroke="#5a9a3c" stroke-width="2" stroke-dasharray="8,4"/>
<text x="60" y="562" class="sml-arch-t sml-arch-b">DDS domain (eProsima Fast DDS): module nodes</text>
<!-- row 1 -->
<g id="application-requirements" class="module_node" style="cursor:pointer">
<rect x="70" y="590" width="300" height="90" rx="10" fill="#e2f0d9" stroke="#5a9a3c" stroke-width="2"/>
<text x="220" y="622" text-anchor="middle" class="sml-arch-t sml-arch-b">App Requirements</text><text x="220" y="645" text-anchor="middle" class="sml-arch-s">WP1 (DFKI)</text><text x="220" y="665" text-anchor="middle" class="sml-arch-s">requirements of the application</text>
</g>
<g id="ml-model-metadata" class="module_node" style="cursor:pointer">
<rect x="430" y="590" width="300" height="90" rx="10" fill="#e2f0d9" stroke="#5a9a3c" stroke-width="2"/>
<text x="580" y="622" text-anchor="middle" class="sml-arch-t sml-arch-b">ML Model Metadata</text><text x="580" y="645" text-anchor="middle" class="sml-arch-s">WP1 (DFKI)</text><text x="580" y="665" text-anchor="middle" class="sml-arch-s">ML goal and keywords</text>
</g>
<g id="hardware-constraints" class="module_node" style="cursor:pointer">
<rect x="790" y="590" width="320" height="90" rx="10" fill="#fdebd3" stroke="#e5953a" stroke-width="2"/>
<text x="950" y="622" text-anchor="middle" class="sml-arch-t sml-arch-b">HW Constraints</text><text x="950" y="645" text-anchor="middle" class="sml-arch-s">WP2 (RPTU)</text><text x="950" y="665" text-anchor="middle" class="sml-arch-s">hardware and memory limit</text>
</g>
<!-- row 2 -->
<g id="ml-model-provider" class="module_node" style="cursor:pointer">
<rect x="250" y="740" width="320" height="100" rx="10" fill="#e2f0d9" stroke="#5a9a3c" stroke-width="2"/>
<text x="410" y="772" text-anchor="middle" class="sml-arch-t sml-arch-b">ML Model Provider</text><text x="410" y="795" text-anchor="middle" class="sml-arch-s">WP1 (DFKI)</text><text x="410" y="815" text-anchor="middle" class="sml-arch-s">suggests the ML model</text>
</g>
<g id="hardware-resource-provider" class="module_node" style="cursor:pointer">
<rect x="680" y="740" width="430" height="150" rx="10" fill="#fdebd3" stroke="#e5953a" stroke-width="2"/>
<text x="895" y="770" text-anchor="middle" class="sml-arch-t sml-arch-b">HW Resources Provider</text><text x="895" y="792" text-anchor="middle" class="sml-arch-s">WP2 (RPTU, DFKI): latency, power, memory</text>
<text x="700" y="822" class="sml-arch-s">- Transformers: LLM framework simulator</text>
<text x="700" y="845" class="sml-arch-s">- CNNs: Axelera Edge 130p, measured YOLO models</text>
<text x="700" y="868" class="sml-arch-s">- CNNs: FPGA xczu19eg, U-Nets predicted by DFKI</text>
</g>
<g id="carbontracker" class="module_node" style="cursor:pointer">
<rect x="250" y="930" width="320" height="100" rx="10" fill="#e8dff2" stroke="#8064a2" stroke-width="2"/>
<text x="410" y="962" text-anchor="middle" class="sml-arch-t sml-arch-b">Carbon Footprint</text><text x="410" y="985" text-anchor="middle" class="sml-arch-s">WP3 (KU)</text><text x="410" y="1005" text-anchor="middle" class="sml-arch-s">energy and CO2 per inference</text>
</g>
<!-- pipeline arrows -->
<line x1="220" y1="680" x2="330" y2="738" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<line x1="580" y1="680" x2="470" y2="738" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<line x1="900" y1="680" x2="560" y2="742" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<line x1="980" y1="680" x2="980" y2="738" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<line x1="570" y1="790" x2="678" y2="790" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<line x1="410" y1="840" x2="410" y2="928" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<path d="M895,890 L895,980 L572,980" fill="none" stroke="#333" stroke-width="2" marker-end="url(#sml_arch_arrow)"/>
<path d="M300,680 Q 620,715 860,738" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#sml_arch_arrow)"/>
<text x="600" y="1045" text-anchor="middle" class="sml-arch-s">Every node also publishes its status, and every output goes back to the orchestrator.</text>
<!-- external services -->
<rect x="1190" y="560" width="380" height="470" rx="14" fill="#f7f7f7" stroke="#999" stroke-width="2"/>
<text x="1380" y="590" text-anchor="middle" class="sml-arch-t sml-arch-b">External services (same host)</text>
<rect x="1215" y="610" width="330" height="80" rx="8" fill="#fff" stroke="#999"/>
<text x="1380" y="640" text-anchor="middle" class="sml-arch-t">Neo4j knowledge graph</text><text x="1380" y="663" text-anchor="middle" class="sml-arch-s">ML goals and models (bolt://localhost:7687)</text>
<rect x="1215" y="710" width="330" height="90" rx="8" fill="#fff" stroke="#999"/>
<text x="1380" y="740" text-anchor="middle" class="sml-arch-t">Ollama server, llama3 LLM</text><text x="1380" y="763" text-anchor="middle" class="sml-arch-s">metadata, Hugging Face search and</text><text x="1380" y="782" text-anchor="middle" class="sml-arch-s">comparison (localhost:11434)</text>
<rect x="1215" y="820" width="330" height="90" rx="8" fill="#fff" stroke="#999"/>
<text x="1380" y="850" text-anchor="middle" class="sml-arch-t">Hugging Face Hub</text><text x="1380" y="873" text-anchor="middle" class="sml-arch-s">model search through an MCP server,</text><text x="1380" y="892" text-anchor="middle" class="sml-arch-s">model information (HF_TOKEN)</text>
<rect x="1215" y="930" width="330" height="80" rx="8" fill="#fff" stroke="#999"/>
<text x="1380" y="960" text-anchor="middle" class="sml-arch-t">Grid carbon intensity table</text><text x="1380" y="983" text-anchor="middle" class="sml-arch-s">per country (Our World in Data / Ember)</text>
</svg>
